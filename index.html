<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vinyl labels</title>
<link href="fonts/fonts.css" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="theme-color" content="#16202A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vinyl labels">
<meta name="description" content="Labels for your records: tracks, BPM measured with the microphone, and print-ready stickers.">
<script src="vendor/qrcode.min.js"></script>
<script>
// iOS app: WKWebView ignores window.print(), so hand printing to the native side (AppViewController.swift)
(()=>{const orig=window.print.bind(window);window.print=()=>{const h=window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.nativePrint;h?h.postMessage(null):orig()}})();
</script>
<style>
:root{--bg:#E9EDF0;--panel:#FFFFFF;--ink:#16202A;--muted:#5E6C78;--line:#CBD3D9;--red:#C8463A;--field:#F5F7F8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#12181D;--panel:#1B232A;--ink:#E6EBEF;--muted:#98A6B1;--line:#2E3A43;--field:#151C22}}
:root[data-theme="dark"]{--bg:#12181D;--panel:#1B232A;--ink:#E6EBEF;--muted:#98A6B1;--line:#2E3A43;--field:#151C22}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Assistant,"Noto Sans JP","Hiragino Sans","Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 16px 60px}
header{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.disc{width:42px;height:42px;border-radius:50%;background:#16202A;display:grid;place-items:center;flex:none}
.disc span{width:16px;height:16px;border-radius:50%;background:var(--red);box-shadow:0 0 0 3px #16202A,0 0 0 4px #3a4650}
h1{font-size:24px;margin:0;font-weight:700}
.sub{color:var(--muted);font-size:14px;margin:0}
.langbox{margin-inline-start:auto;min-width:140px}
.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.panel h2{font-size:17px;margin:0 0 10px;font-weight:700}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
label.f{display:block;font-size:13px;color:var(--muted)}
input[type=text],input[type=url],select{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:6px;padding:7px 9px;margin-top:3px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--red);outline-offset:1px}
.tracks{width:100%;border-collapse:collapse;margin-top:6px}
.tracks th{font-size:12px;color:var(--muted);font-weight:600;text-align:start;padding:4px 3px}
.tracks td{padding:3px}
.tracks input,.tracks select{margin-top:0;padding:6px;font-size:14px}
.tscroll{overflow-x:auto}
button{font:inherit;font-size:15px;border-radius:6px;padding:8px 14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
button:disabled{opacity:.5;cursor:default}
button.main{background:#16202A;color:#fff;border-color:#16202A}
:root[data-theme="dark"] button.main{background:#E6EBEF;color:#16202A;border-color:#E6EBEF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) button.main{background:#E6EBEF;color:#16202A;border-color:#E6EBEF}}
button.x{padding:4px 8px;color:var(--muted)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.toggles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 10px}
.toggles label{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:15px;cursor:pointer}
.toggles input{width:18px;height:18px;accent-color:var(--red)}
.gap{height:14px}
.stage{background:repeating-linear-gradient(45deg,var(--field) 0 8px,var(--panel) 8px 16px);border-radius:8px;padding:18px;display:flex;justify-content:center;overflow:auto}
.scale{transform:scale(1.35);transform-origin:top center}
.size{font-size:13px;color:var(--muted);text-align:center;margin-top:8px}
.queue{list-style:none;margin:8px 0 0;padding:0}
.queue li{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:6px 0;font-size:14px}
.hint{font-size:13px;color:var(--muted);margin:8px 0 0}
#nav{display:none}
body.steps #nav{display:flex;position:fixed;inset-inline-start:0;inset-inline-end:0;bottom:0;gap:10px;align-items:center;
  background:var(--panel);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:6}
#nav .mid{flex:1;min-width:0;text-align:center}
#nav .name{font-weight:700;font-size:15px}
#nav .num{font-size:12px;color:var(--muted)}
.dots{display:flex;gap:4px;justify-content:center;margin-top:4px}
.dot{width:16px;height:16px;display:grid;place-items:center}
.dot::before{content:"";width:9px;height:9px;border-radius:50%;border:1px solid var(--line);background:var(--field)}
.dot.on::before{background:var(--red);border-color:var(--red)}
body.steps [data-step]{display:none}
body.steps [data-step].on{display:block}
body.steps .gap{display:none}
body.steps .wrap{padding-bottom:110px}
body.steps .grid{grid-template-columns:1fr}
#viewSel button[aria-pressed="true"]{background:#16202A;color:#fff;border-color:#16202A}
:root[data-theme="dark"] #viewSel button[aria-pressed="true"]{background:#E6EBEF;color:#16202A;border-color:#E6EBEF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #viewSel button[aria-pressed="true"]{background:#E6EBEF;color:#16202A;border-color:#E6EBEF}}
#mock{width:100%;overflow:hidden}
.mock{position:relative;margin:0 auto;border-radius:2px;max-width:100%}
.mock .lblwrap{position:absolute;transform-origin:top left}
.sleeve{background:linear-gradient(135deg,#d9d2c5,#efeae0);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25),0 2px 10px rgba(0,0,0,.25)}
.sleeve .spine{position:absolute;inset-inline-start:0;top:0;bottom:0;background:rgba(0,0,0,.12)}
.disc{background:radial-gradient(circle at 50% 50%,#1b1b1b 0 12%,#111 12% 13%,#1d1d1d 13% 100%);border-radius:50%;
  box-shadow:0 2px 10px rgba(0,0,0,.35)}
.disc .center{position:absolute;border-radius:50%;background:#C8463A;left:50%;top:50%;transform:translate(-50%,-50%)}
.disc .hole{position:absolute;border-radius:50%;background:var(--panel);left:50%;top:50%;transform:translate(-50%,-50%)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;max-width:520px;width:100%;max-height:85vh;overflow:auto}
.modal h2{margin:0 0 6px}
.scanlist{list-style:none;margin:10px 0 0;padding:0}
.scanlist li{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding:7px 0}
.scanlist input[type=checkbox]{width:18px;height:18px;accent-color:var(--red);flex:none}
.scanlist .p{font-weight:600;width:28px;flex:none}
.scanlist .n{flex:1;min-width:0;font-size:15px}
.scanlist .n b{font-weight:600}
.scanlist .t{color:var(--muted);font-size:14px}
.phead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.phead h2{margin:0}
.lib{list-style:none;margin:8px 0 0;padding:0;max-height:320px;overflow-y:auto}
.lib li{display:flex;align-items:center;gap:4px;border-top:1px solid var(--line)}
.lib li.cur{background:var(--field)}
.lib .open{flex:1;min-width:0;text-align:start;border:0;background:none;padding:7px 6px;border-radius:0;display:block}
.lib .open b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lib .meta{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lib .x{flex:none}
.bar{height:10px;background:var(--field);border:1px solid var(--line);border-radius:5px;margin-top:6px;overflow:hidden}

.lbl{width:62mm;background:#fff;color:#000;padding:2.6mm 2.8mm 2.4mm;direction:ltr;text-align:left;font-family:"Archivo Narrow","Arial Narrow","Noto Sans JP","Hiragino Sans",Arial,sans-serif;border:0.3mm solid #000}
.lbl .top{display:flex;justify-content:space-between;align-items:flex-start;gap:2mm}
.lbl .t{font-size:10.5pt;font-weight:600;line-height:1.15}
.lbl .m{font-size:7.5pt;line-height:1.3}
.lbl .vo{font-size:6.5pt;border:0.25mm solid #000;padding:0.3mm 1.2mm;white-space:nowrap}
.lbl .rule{border-bottom:0.45mm solid #000;margin:1.4mm 0 0.8mm}
.lbl .tr{padding:0.9mm 0}
.lbl .tr.sideend{border-bottom:0.25mm dashed #000;margin-bottom:0.5mm}
.lbl .l1{display:flex;gap:1.5mm;font-size:8pt;line-height:1.25}
.lbl .pos{font-weight:600;width:5mm;flex:none}
.lbl .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbl .nm b{font-weight:600}
.lbl .l2{display:flex;align-items:center;gap:2.5mm;font-size:7.5pt;margin:0.4mm 0 0 6.5mm}
.lbl .bpm b{font-weight:600;font-size:8.5pt}
.lbl .note{font-style:italic}
.lbl.round{position:relative;width:95mm;height:95mm;border-radius:50%;padding:0;border-width:0.3mm;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden}
.lbl.round .half{position:absolute;left:50%;transform:translateX(-50%);width:66mm;max-height:33mm;overflow:hidden;
  display:flex;flex-direction:column}
.lbl.round .half.up{bottom:calc(50% + 5.5mm);justify-content:flex-end}
.lbl.round .half.down{top:calc(50% + 5.5mm);justify-content:flex-start}
.lbl.round .holegap{display:none}
.lbl.round .top{justify-content:center}
.lbl.round .t{font-size:9pt}
.lbl.round .m{font-size:6.8pt}
.lbl.round .rule{margin:1.2mm 0 0}
.lbl.round .l1,.lbl.round .l2{font-size:6.6pt;line-height:1.15}
.lbl.round .tr{padding:0.45mm 0}
.lbl.round .l2{margin-top:0.2mm}
.lbl.round .en i{width:1.8mm;height:1.9mm}
.lbl.round .l1{justify-content:center;gap:2mm}
.lbl.round .nm{flex:0 1 auto;max-width:44mm}
.lbl.round .pos{width:auto}
.lbl.round .l2{margin-left:0;justify-content:flex-start}
.lbl.round .foot{margin-top:1mm;padding-top:0.8mm}
.lbl.round .qr{width:9mm;height:9mm}
.lbl.round .qr img,.lbl.round .qr canvas{width:9mm!important;height:9mm!important}
.lbl.round .vo{font-size:5.8pt}
.lbl.round .hole{position:absolute;width:7.3mm;height:7.3mm;border-radius:50%;border:0.25mm dashed #000;
  left:50%;top:50%;transform:translate(-50%,-50%);z-index:1}
.lbl .l2{flex-wrap:wrap}
.lbl .blank{display:inline-block;width:7mm;border-bottom:0.25mm solid #000}
.lbl .en{display:flex;gap:0.35mm}
.lbl .en i{display:block;width:2.1mm;height:2.3mm;border:0.22mm solid #000}
.lbl .en i.on{background:#000}
.lbl.red .en i{border-color:#C8463A}
.lbl.red .en i.on{background:#C8463A}
.lbl.red .ennum{color:#C8463A}
.lbl .foot{display:flex;justify-content:space-between;align-items:flex-end;border-top:0.45mm solid #000;margin-top:1.2mm;padding-top:1.2mm}
.lbl .foot .m{font-size:6.5pt}
.lbl .qr{width:12mm;height:12mm}
.lbl .qr img,.lbl .qr canvas{width:12mm!important;height:12mm!important;display:block}
#print{display:none}
@media print{
  html,body{background:#fff;margin:0;padding:0;height:auto;overflow:hidden}
  .wrap,#nav,.modal{display:none!important}   /* nothing from the app UI reaches the paper */
  #print{display:block}
  .sheet{position:relative;width:210mm;page-break-after:always;overflow:hidden}
  .sheet:last-child{page-break-after:auto} /* no blank page at the end */
  .cell{position:absolute;outline:0.25mm dashed #444}
  .cell.roundcell{outline:none;border:0.25mm dashed #444;border-radius:50%}
  .cell .lbl,.single .lbl{border:none}
  .tick{position:absolute;background:#000}
  .corner{position:absolute;border:0 solid #000}
  .credit{position:absolute;left:0;right:0;text-align:center;font-family:"Archivo Narrow",Arial,sans-serif;font-size:7pt;color:#555}
}
</style>
<style id="pagesize"></style>
</head>
<body>
<div class="wrap">
<header>
  <div class="disc" aria-hidden="true"><span></span></div>
  <div><h1 data-i="app_title"></h1><p class="sub" data-i="app_sub"></p></div>
  <label class="f langbox"><span data-i="lang"></span><select id="langSel"></select></label>
</header>
<div class="grid">
<div>
  <section class="panel" data-step="0">
    <div class="phead"><h2 data-i="lib_h"></h2><button class="main" id="newRec" data-i="new_rec"></button></div>
    <input type="text" id="libSearch" dir="auto" style="display:none">
    <ul class="lib" id="lib"></ul>
    <p class="hint" data-i="lib_hint"></p>
  </section>
  <div class="gap"></div>
  <section class="panel" data-step="1">
    <h2 data-i="rec_h"></h2>
    <div class="row">
      <label class="f"><span data-i="f_title"></span><input type="text" id="title" dir="auto"></label>
      <label class="f"><span data-i="f_artist"></span><input type="text" id="artist" dir="auto"></label>
      <label class="f"><span data-i="f_label"></span><input type="text" id="label" dir="auto"></label>
      <label class="f"><span data-i="f_cat"></span><input type="text" id="cat" dir="ltr"></label>
      <label class="f"><span data-i="f_year"></span><input type="text" id="year" dir="auto"></label>
      <label class="f"><span data-i="f_style"></span><input type="text" id="style" dir="auto"></label>
    </div>
    <div class="gap"></div>
    <label class="f"><span data-i="f_link"></span><input type="url" id="link" dir="ltr"></label>
    <div class="gap"></div>
    <label class="f"><span data-i="f_note"></span><input type="text" id="note" dir="auto"></label>
  </section>
  <div class="gap"></div>
  <section class="panel" data-step="2">
    <h2 data-i="tracks_h"></h2>
    <p class="hint" style="margin-top:0" data-i="fill_from"></p>
    <div class="btns" style="margin-top:6px"><button class="main" id="scanBtn" data-i="scan" style="display:none"></button><button class="main" id="pasteBtn" data-i="paste"></button></div>
    <p class="hint" data-i="scan_hint" id="scanHint" style="display:none"></p>
    <div class="tscroll">
    <table class="tracks">
      <thead><tr><th style="width:52px" data-i="th_side"></th><th data-i="th_artist"></th><th data-i="th_title"></th><th style="width:64px" data-i="th_time"></th><th style="width:62px">BPM</th><th style="width:70px" data-i="th_energy"></th><th data-i="th_note"></th><th style="width:34px"></th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    </div>
    <div class="btns"><button id="addTrack" data-i="add_track"></button></div>
    <p class="hint" data-i="tracks_hint"></p>
  </section>
  <div class="gap"></div>
  <section class="panel" data-step="3">
    <h2 data-i="mic_h"></h2>
    <div class="row">
      <label class="f"><span data-i="m_track"></span><select id="mTrack"></select></label>
      <label class="f"><span data-i="m_dur"></span><select id="mDur"><option value="15"></option><option value="20" selected></option><option value="30"></option></select></label>
    </div>
    <div class="gap"></div>
    <label class="f"><span data-i="m_range"></span><select id="mRange"><option value="100-150" data-i="r_house" selected></option><option value="80-120" data-i="r_down"></option><option value="130-180" data-i="r_fast"></option></select></label>
    <div class="btns"><button class="main" id="mStart" data-i="m_start"></button><button id="tap" data-i="tap"></button></div>
    <div id="mLive" style="display:none;margin-top:12px">
      <div style="display:flex;justify-content:space-between;font-size:14px"><span data-i="listening"></span><span id="mLeft"></span></div>
      <div class="bar"><div id="mLevel" style="height:100%;width:0;background:var(--red);transition:width 80ms"></div></div>
      <div style="height:4px;background:var(--field);border-radius:2px;margin-top:6px;overflow:hidden"><div id="mProg" style="height:100%;width:0;background:var(--muted)"></div></div>
    </div>
    <div id="mResult" style="display:none;margin-top:12px;border-top:1px solid var(--line);padding-top:12px">
      <div style="display:flex;align-items:baseline;gap:10px"><span id="mBpm" style="font-size:40px;font-weight:700;line-height:1" dir="ltr"></span><span id="mUnit" style="color:var(--muted)">BPM</span><span id="mExact" style="color:var(--muted);font-size:13px" dir="ltr"></span></div>
      <div id="mConf" style="font-size:14px;margin-top:6px"></div>
      <div class="btns"><button class="main" id="mUse"></button><button id="mAgain" data-i="m_again"></button></div>
    </div>
    <p class="hint" data-i="mic_hint"></p>
  </section>
</div>
<div>
  <section class="panel" data-step="4">
    <h2 data-i="show_h"></h2>
    <div class="toggles" id="toggles"></div>
    <div class="gap"></div>
    <div class="row">
      <label class="f"><span data-i="f_shape"></span><select id="shape"><option value="rect" data-i="shape_rect"></option><option value="round" data-i="shape_round"></option></select></label>
      <label class="f"><span data-i="f_color"></span><select id="color"><option value="black" data-i="c_black"></option><option value="red" data-i="c_red"></option></select></label>
      <label class="f"><span data-i="f_enmode"></span><select id="enmode"><option value="bar" data-i="en_bar"></option><option value="num" data-i="en_num"></option></select></label>
    </div>
  </section>
  <div class="gap"></div>

  <div class="gap"></div>

  <div class="gap"></div>
  <section class="panel" data-step="0">
    <h2 data-i="backup_h"></h2>
    <div class="btns" style="margin-top:0"><button id="exportB" data-i="export"></button><button id="importB" data-i="import"></button></div>
    <input type="file" id="importFile" accept="application/json,.json" style="display:none">
    <p class="hint" data-i="backup_hint"></p>
  </section>
  <div class="gap"></div>
  <section class="panel" data-step="5">
    <h2 data-i="a4_h"></h2>
    <ul class="queue" id="queue"></ul>
    <p class="hint" id="a4Status"></p>
    <div class="btns"><button id="printA4" data-i="print_all"></button><button id="clearQ" data-i="clear"></button></div>
    <p class="hint" data-i="a4_hint"></p>
  </section>
  <div class="gap"></div>
  <section class="panel" data-step="5">
    <h2 data-i="preview_h"></h2>
    <div class="btns" id="viewSel" style="margin:0 0 10px">
      <button data-view="flat" data-i="view_flat"></button>
      <button data-view="sleeve" data-i="view_sleeve"></button>
      <button data-view="disc" data-i="view_disc"></button>
    </div>
    <div class="stage" id="stage"><div class="scale" id="scaleBox"><div id="preview"></div></div></div>
    <div id="mock" style="display:none"></div>
    <p class="hint" id="mockHint" data-i="mock_hint" style="display:none"></p>
    <p class="hint" id="holeHint" data-i="hole_hint" style="display:none"></p>
    <p class="hint" id="roundFull" style="display:none;color:var(--red)"></p>
    <div class="size" id="size"></div>
    <div class="btns">
      <button class="main" id="printA4b" data-i="print_a4"></button>
      <button id="printOne" data-i="print_label"></button>
      <button id="addQueue" data-i="add_queue"></button>
    </div>
  </section>
</div>
</div>
</div>
<nav id="nav" aria-label="steps">
  <button id="prev" data-i="back"></button>
  <div class="mid"><div class="name" id="stepName"></div><div class="num" id="stepNum"></div><div class="dots" id="dots"></div></div>
  <button class="main" id="next" data-i="next"></button>
</nav>
<div id="print"></div>

function detectBPM(x, sr, opt){
  opt=opt||{};const lo=opt.lo||100, hi=opt.hi||150, hop=opt.hop||128;
  const n=Math.floor(x.length/hop);const env=new Float32Array(n);
  const win=opt.win||1024;const cs=new Float64Array(x.length+1);for(let i=0;i<x.length;i++)cs[i+1]=cs[i]+x[i]*x[i];
  let prev=0;
  for(let i=0;i<n;i++){const a=i*hop,b=Math.min(x.length,a+win);
    const l=Math.log(1e-9+(cs[b]-cs[a])/(b-a));env[i]=i?Math.max(0,l-prev):0;prev=l;}
  const fr=sr/hop, W=Math.round(fr*0.5);const on=new Float32Array(n);let acc=0;
  for(let i=0;i<n;i++){acc+=env[i];if(i>=W)acc-=env[i-W];const m=acc/Math.min(i+1,W);on[i]=Math.max(0,env[i]-m);}
  let mean=0;for(let i=0;i<n;i++)mean+=on[i];mean/=n;for(let i=0;i<n;i++)on[i]-=mean;
  const K=8, maxLag=Math.min(n-1,Math.ceil(K*60*fr/lo)+2);const ac=new Float32Array(maxLag+1);
  for(let L=0;L<=maxLag;L++){let s=0;for(let i=0;i+L<n;i++)s+=on[i]*on[i+L];ac[L]=s/(n-L);}
  const at=t=>{const i=Math.floor(t),f=t-i;return i+1<=maxLag?ac[i]*(1-f)+ac[i+1]*f:0};
  let best=0,bs=-1e9;const scores=[];
  for(let b=lo;b<=hi+1e-9;b+=0.05){const p=60*fr/b;let s=0;for(let k=1;k<=K;k++)s+=at(k*p);scores.push(s);if(s>bs){bs=s;best=b;}}
  const sorted=scores.slice().sort((a,b)=>a-b);const med=sorted[sorted.length>>1],mx=sorted[sorted.length-1],mn=sorted[0];
  const conf=(bs-med)/((mx-mn)||1);
  return {bpm:Math.round(best*10)/10,confidence:conf};
}

const ROUND_MM=95;
// The label is built in three parts, so the round version can put the record's
// details above the spindle hole and the tracks below it.
function labelHTML(r,s){
  const on=s.on,round=s.shape==="round";
  let head=`<div class="top"><div style="min-width:0"><div class="t">${esc(r.title)}</div>`;
  const l=[r.artist,on.label?r.label:""].filter(Boolean).join(" – ");if(l)head+=`<div class="m">${esc(l)}</div>`;
  const m=[on.cat?r.cat:"",on.year?r.year:""].filter(Boolean).join("  ");if(m)head+=`<div class="m">${esc(m)}</div>`;
  head+=`</div>${on.vo?'<div class="vo">Vinyl only</div>':""}</div>`;
  if(on.style&&r.style)head+=`<div class="m" style="margin-top:0.6mm">${esc(r.style)}</div>`;
  if(on.rnote&&r.note)head+=`<div class="m note" style="margin-top:0.6mm">${esc(r.note)}</div>`;
  head+=`<div class="rule"></div>`;
  let body="";
  r.tracks.forEach((tr,i)=>{
    const next=r.tracks[i+1],sideEnd=next&&next.p&&tr.p&&next.p[0].toUpperCase()!==tr.p[0].toUpperCase();
    body+=`<div class="tr ${sideEnd?"sideend":""}"><div class="l1"><span class="pos">${esc(tr.p)}</span><span class="nm">${tr.a?`<b>${esc(tr.a)}</b> – `:""}${esc(tr.n)}</span>${on.time&&tr.t?`<span>${esc(tr.t)}</span>`:""}</div>`;
    let d="";
    if(on.bpm)d+=`<span class="bpm">BPM ${tr.b?`<b>${esc(tr.b)}</b>`:'<span class="blank"></span>'}</span>`;
    if(on.energy){const e=+tr.e||0;
      if(s.enmode==="num")d+=`<span class="ennum">E ${e?`<b>${e}</b>/10`:'<span class="blank"></span>'}</span>`;
      else d+=`<span class="en">${Array.from({length:10},(_,k)=>`<i class="${k<e?"on":""}"></i>`).join("")}</span>`;}
    if(on.note&&tr.note)d+=`<span class="note">${esc(tr.note)}</span>`;
    if(d)body+=`<div class="l2">${d}</div>`;
    body+=`</div>`;
  });
  const foot=(on.qr&&r.link)?`<div class="foot"><div class="m">deejay.de</div><div class="qr" data-qr="${esc(r.link)}"></div></div>`:"";
  const cls=`lbl ${round?"round":""} ${s.color==="red"?"red":""}`;
  if(!round)return `<div class="${cls}">${head}${body}${foot}</div>`;
  // top half, the hole, bottom half: nothing is printed where the spindle goes
  return `<div class="${cls}"><div class="hole"></div>
    <div class="half up">${head}</div><div class="holegap"></div><div class="half down">${body}${foot}</div></div>`;
}

// Lines come from the iOS text recognizer, each with its place on the photo (y: 1 = top).
function scanLines(items){
  const rows=[];

    const r=rows[rows.length-1];
    if(r&&Math.abs(r.y-it.y)<Math.max(0.012,it.h*0.6)){r.parts.push(it);r.y=(r.y+it.y)/2}
    else rows.push({y:it.y,parts:[it]});

}
// lines that a sleeve is full of, but that are never a track
const SKIP=/(\brpm\b|℗|©|\(p\)|\(c\)|all rights|made in|manufact|distribut|www\.|http|@|record(ed|ing)? (at|by)|master(ed|ing)|cut (at|by)|mixed by|written by|produced by|composed|publish|licen|copyright|thanks|artwork|design|photo by|stereo|\bgmbh\b|\bltd\b|\binc\b|\bbmi\b|\bascap\b|\bgema\b|^side\b|^face\b|^seite\b|^disc\b|^lp\b|^ep\b|^tracklist)/i;

function parseLines(lines){
  const out=[];
  lines.forEach(line=>{
    let s=line.replace(/[•·|]/g," ").replace(/\s+/g," ").trim();
    if(s.length<3||SKIP.test(s))return;
    if(!/[a-z\u0370-\u04ff\u0590-\u05ff]/i.test(s))return;
    let p="";
    let m=s.match(/^([A-Fa-f])\s?([1-9][0-9]?)\s*[.):\-\]]?\s+(.+)$/);
    let fixed=false;
    if(m){p=m[1].toUpperCase()+m[2];s=m[3];fixed=true}
    else{m=s.match(/^([1-9][0-9]?)\s*[.):\-\]]\s+(.+)$/);if(m)s=m[2]}
    let time="";
    const mt=s.match(/\(?\b([0-9]{1,2}:[0-5][0-9])\b\)?/);
    if(mt){time=mt[1];s=s.replace(mt[0],"").trim()}
    // shop lists often carry the BPM, and sometimes the key, after the length
    let bpm="";
    const mb=s.match(/\b([0-9]{2,3}(?:\.[0-9])?)\s*bpm\b/i)||(time?s.match(/(?:^|\s)([0-9]{2,3})(?=\s*$)/):null);
    if(mb&&+mb[1]>=60&&+mb[1]<=220){bpm=String(Math.round(+mb[1]));s=s.replace(mb[0],"").trim()}
    s=s.replace(/\b([A-G][#b\u266d\u266f]?\s?(?:min|maj|minor|major))\b/i,"").trim();
    s=s.replace(/^[\s.\-–—:]+|[\s.\-–—:]+$/g,"");
    if(s.length<2)return;
    const words=s.split(" ").length;
    if(!p&&!time&&(words>8||s.length>60))return;
    let a="",n=s;
    const ms=s.split(/\s[–—\-]\s|\s\/\s/);
    if(ms.length>1&&ms[0].length>1&&ms[1].length>1){a=ms[0].trim();n=ms.slice(1).join(" - ").trim()}
    // a line that has none of the marks of a track (position, length, artist) is
    // probably a header, so it is listed but not ticked
    out.push({p,a,n,t:time,b:bpm,e:"",note:"",fixed,sure:!!(p||time||a||bpm)});
  });
  return renumber(pickTracks(out));
}
// A sleeve photo also carries credits, addresses and small print. When the photo does
// contain real track lines — ones with a position (A1, B2) or a length (7:29) — keep only
// those, so the rest of the sleeve never reaches the list.
function pickTracks(out){
  const strong=out.filter(tr=>tr.fixed||tr.t);
  if(strong.length>=2)return strong.slice(0,40);
  const sure=out.filter(tr=>tr.sure);
  if(sure.length>=2)return sure.slice(0,40);
  return out.slice(0,40);
}

// fill in missing positions: A1, A2, ... continuing from the last one that was read
function renumber(list){
  let side="A",num=0;
  list.forEach(tr=>{
    const mm=tr.p&&tr.p.match(/^([A-F])([0-9]+)$/);
    if(mm){side=mm[1];num=+mm[2]}else{num++;tr.p=side+num}
  });

}
// Besides the tracks, a sleeve or a centre label states the title, the label,

// and on a sleeve the title is printed larger than everything around it.
const TRACKISH=/^[A-Fa-f]\s?[0-9]{1,2}\b|\b[0-9]{1,2}:[0-5][0-9]\b/;
function parseInfo(lines, heights, tracks){
  const info={title:"",artist:"",label:"",cat:"",year:"",country:""};
  const sure={};
  const cands=[];
  lines.forEach((raw,i)=>{
    const l=String(raw).replace(/\s+/g," ").trim();
    if(!l)return;
    const h=heights?heights[i]:0;
    const my=l.match(/\b(19|20)[0-9]{2}\b/);
    if(my&&!info.year){info.year=my[0];sure.year=true}
    const mco=l.match(/made in ([A-Za-z ]{3,20})/i);
    if(mco&&!info.country)info.country=mco[1].trim().replace(/\s+$/,"");
    const mc=l.match(/\b([A-Z][A-Z0-9]{1,6}[ -]?[0-9]{2,5})\b/);
    if(mc&&!info.cat&&!/\b(19|20)[0-9]{2}\b/.test(mc[1])&&!TRACKISH.test(l)){info.cat=mc[1].replace(/ /g,"");sure.cat=true}

        .replace(/[℗©]/g,"").replace(/\b(19|20)[0-9]{2}\b/g,"").replace(/&/g,"").replace(/\s+/g," ").trim();
      sure.label=true;
    }

  });

  // every track by the same artist means the record is by that artist
  const artists=[...new Set(tracks.map(tr=>tr.a).filter(Boolean))];
  if(artists.length===1){info.artist=artists[0];sure.artist=true}
  else if(artists.length>2){info.artist="Various";sure.artist=true}
  const rest=cands.filter(c=>c.l!==info.label&&c.l!==info.cat&&c.l!==info.artist);
  if(heights&&rest.length){
    const sorted=rest.slice().sort((a,b)=>b.h-a.h);

  }else if(rest.length){
    info.title=rest[0].l;sure.title=false;
  }

}

  const src=ctx.createMediaStreamSource(stream);const lp=ctx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=150;lp.Q.value=0.7;
  const proc=ctx.createScriptProcessor(4096,1,1);const mute=ctx.createGain();mute.gain.value=0;
  const chunks=[];let total=0;const need=+$("mDur").value*ctx.sampleRate;
  const raw=ctx.createAnalyser();raw.fftSize=1024;src.connect(raw);const buf=new Float32Array(raw.fftSize);
  src.connect(lp);lp.connect(proc);proc.connect(mute);mute.connect(ctx.destination);
  mState={stream,ctx};
  $("mLive").style.display="block";$("mStart").disabled=true;$("mAgain").disabled=true;
  proc.onaudioprocess=ev=>{if(!mState)return;const d=ev.inputBuffer.getChannelData(0);chunks.push(new Float32Array(d));total+=d.length;
    raw.getFloatTimeDomainData(buf);let m=0;for(const v of buf)m=Math.max(m,Math.abs(v));$("mLevel").style.width=Math.min(100,m*140)+"%";
    $("mProg").style.width=Math.min(100,total/need*100)+"%";$("mLeft").textContent=t("left",{n:Math.max(0,Math.ceil((need-total)/ctx.sampleRate))});
    if(total>=need)finish();};
  function finish(){
    const sr=ctx.sampleRate;proc.onaudioprocess=null;stream.getTracks().forEach(tr=>tr.stop());try{ctx.close()}catch(e){}mState=null;
    $("mLive").style.display="none";$("mStart").disabled=false;$("mAgain").disabled=false;
    const x=new Float32Array(total);let o=0;for(const c of chunks){x.set(c,o);o+=c.length}
    const [lo,hi]=$("mRange").value.split("-").map(Number);
    let peak=0;for(let i=0;i<x.length;i+=64)peak=Math.max(peak,Math.abs(x[i]));
    if(peak<0.002){lastResult=[0,0,false,"silent"]}else{const r=detectBPM(x,sr,{lo,hi});lastResult=[r.bpm,r.confidence,false,null]}
    showResult(...lastResult);
  }
}
function showResult(bpm,conf,tapped,msg){
  const i=+$("mTrack").value,tr=rec.tracks[i];
  $("mResult").style.display="block";
  if(msg){$("mBpm").textContent="";$("mExact").textContent="";$("mUnit").style.display="none";$("mUse").style.display="none";$("mConf").textContent=t(msg);return;}
  $("mUnit").style.display="";
  $("mBpm").textContent=Math.round(bpm);$("mExact").textContent=bpm.toFixed(1);
  $("mConf").textContent=tapped?t("tap_note"):t(conf>=0.8?"conf_high":conf>=0.65?"conf_mid":"conf_low");
  $("mUse").style.display="";$("mUse").textContent=t("use",{p:tr?tr.p:""});$("mUse").dataset.bpm=Math.round(bpm);
}
$("mStart").onclick=startMeasure;$("mAgain").onclick=startMeasure;
$("mUse").onclick=()=>{const i=+$("mTrack").value;if(!rec.tracks[i])return;rec.tracks[i].b=$("mUse").dataset.bpm;drawTracks();changed();
  if(i+1<rec.tracks.length)$("mTrack").value=i+1;$("mResult").style.display="none";lastResult=null;};
let taps=[];
$("tap").onclick=()=>{const now=performance.now();if(taps.length&&now-taps[taps.length-1]>2000)taps=[];taps.push(now);if(taps.length>12)taps.shift();
  if(taps.length<5){$("tap").textContent=`${t("tap")} (${taps.length})`;return}
  $("tap").textContent=t("tap");const iv=(taps[taps.length-1]-taps[0])/(taps.length-1);lastResult=[60000/iv,1,true,null];showResult(...lastResult);};

// ----- steps on a phone, everything at once on a big screen -----
const STEPS=["s_lib","s_rec","s_tracks","s_mic","s_label","s_print"];
const narrow=window.matchMedia("(max-width:900px)");
let step=Math.min(STEPS.length-1,Math.max(0,+load("vl_step",0)||0));
function drawStep(){
  document.body.classList.toggle("steps",narrow.matches);
  document.querySelectorAll("[data-step]").forEach(el=>el.classList.toggle("on",+el.dataset.step===step));
  $("stepName").textContent=t(STEPS[step]);
  $("stepNum").textContent=t("step_of",{a:step+1,b:STEPS.length});
  $("prev").disabled=step===0;$("next").disabled=step===STEPS.length-1;
  $("dots").innerHTML=STEPS.map((k,i)=>`<span class="dot ${i===step?"on":""}" title="${esc(t(k))}"></span>`).join("");
  drawMock();requestAnimationFrame(drawMock);
}
function goStep(i){step=Math.max(0,Math.min(STEPS.length-1,i));save("vl_step",step);drawStep();window.scrollTo({top:0,behavior:"smooth"})}
$("prev").onclick=()=>goStep(step-1);
$("next").onclick=()=>goStep(step+1);

narrow.addEventListener("change",drawStep);

// ----- how the label looks on a real sleeve or record -----
let view=load("vl_view","flat");
const SLEEVE_MM=315, DISC_MM=302, CENTER_MM=100, HOLE_MM=7;
function drawMock(){
  [...$("viewSel").children].forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.view===view)));
  const box=$("mock"),flat=view==="flat";
  $("stage").style.display=flat?"":"none";
  box.style.display=flat?"none":"";
  $("mockHint").style.display=flat?"none":"";
  if(flat)return;
  const round=set.shape==="round";
  const labelH=round?ROUND_MM:labelHeightPx()/PX_MM, labelW=round?ROUND_MM:62;
  const avail=Math.max(160,(box.getBoundingClientRect().width||box.clientWidth||300)-6);
  const mm=view==="sleeve"?SLEEVE_MM:DISC_MM;
  const s=Math.min(avail,420)/mm, k=s/PX_MM;
  const left=view==="sleeve"?18:(mm-labelW)/2, top=view==="sleeve"?18:(mm-labelH)/2;
  box.innerHTML=`<div class="mock ${view==="sleeve"?"sleeve":"disc"}" style="width:${mm*s}px;height:${mm*s}px">
    ${view==="sleeve"?`<div class="spine" style="width:${3*s}px"></div>`:
      `<div class="center" style="width:${CENTER_MM*s}px;height:${CENTER_MM*s}px"></div><div class="hole" style="width:${HOLE_MM*s}px;height:${HOLE_MM*s}px"></div>`}
    <div class="lblwrap" style="left:${left*s}px;top:${top*s}px;transform:scale(${k})">${labelHTML(rec,set)}</div>
  </div>`;
  fillQR(box);
}
$("viewSel").addEventListener("click",e=>{const v=e.target.dataset.view;if(v){view=v;save("vl_view",v);drawMock()}});
window.addEventListener("resize",()=>{if(view!=="flat")drawMock()});

applyLang();
drawStep();

// on the website, keep a copy for offline use (the iPhone app already carries its files)
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)&&!inApp()){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>changed());
</script>
